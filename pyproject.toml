[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rescuesense"
version = "0.2.0"
description = "Bounded rescue perception and safety integration reference runtime"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "Nima Khaki"}]
dependencies = []
readme = "README.md"

[project.optional-dependencies]
vision = ["numpy==2.3.5", "opencv-python-headless==4.13.0.92"]

[project.scripts]
rescuesense = "rescuesense.__main__:main"

[tool.setuptools.packages.find]
include = ["rescuesense*"]

[tool.setuptools.package-data]
"rescuesense.models" = ["*.json"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "PLW1510"]
