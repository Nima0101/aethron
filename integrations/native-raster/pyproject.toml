[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aethron-raster-native"
version = "0.1.0"
description = "Optional bounded recorded Brown intensity remapping kernel"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["aethron-edge==0.1.0"]

[tool.setuptools.packages.find]
include = ["aethron_raster_native*"]

[tool.setuptools.package-data]
aethron_raster_native = ["*.hpp", "*.cpp"]
