[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aethron-vision-native"
version = "0.3.0"
description = "Optional bounded native output admission for AETHRON vision"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools.packages.find]
include = ["aethron_vision_native*"]

[tool.setuptools.package-data]
aethron_vision_native = ["*.c"]
