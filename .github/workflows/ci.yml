name: Software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/verify.py
      - run: python scripts/fuzz.py
      - run: python scripts/temporal_fuzz.py
      - run: python scripts/reproduce.py
  development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check aethron tests scripts
      - run: ruff format --check aethron tests scripts
      - run: bandit -r aethron
      - run: pip-audit --cache-dir build/audit-cache --disable-pip --no-deps -r requirements-dev.txt
      - run: coverage run --source=aethron -m unittest discover -s tests
      - run: coverage report -m
      - run: python scripts/package_check.py
      - run: python scripts/temporal_evaluate.py --out build/v3-registered
      - run: python scripts/temporal_visuals.py --out build/reproduced-visuals
      - run: python scripts/verify_visuals.py build/reproduced-visuals
      - run: python scripts/recorded_visual.py
      - run: python -m build --no-isolation
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-and-packages
          path: |
            build/browser/
            dist/

  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r requirements-vision.txt
      - run: pip-audit --cache-dir build/audit-cache --disable-pip --no-deps -r requirements-vision.txt
      - run: python scripts/fetch_aot.py
      - run: python scripts/fetch_rgb_model.py
      - run: python scripts/vision_e2e.py
      - run: python scripts/vision_smoke.py
      - run: python scripts/vision_supply_chain.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorded-model-evidence
          path: build/vision/
