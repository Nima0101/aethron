name: Qualification declaration contracts
on:
  pull_request:
    paths:
      - 'qualification/**'
      - 'aethron/_json_bounds.py'
      - 'requirements-dev.txt'
      - '.github/workflows/aethron-qualification.yml'
  push:
    branches: [main, 'parallel/p4-qualification-20261009']
    paths:
      - 'qualification/**'
      - 'aethron/_json_bounds.py'
      - 'requirements-dev.txt'
      - '.github/workflows/aethron-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s qualification/tests -v
      - name: Exercise declaration review negative controls
        run: python -m qualification.technology.review_declarations > declaration-review-v3.json
      - name: Exercise artifact review negative controls
        run: python -m qualification.technology.review_artifacts > artifact-review-v3.json
      - name: Exercise campaign review negative controls
        run: python -m qualification.technology.review_campaign > campaign-review-v3.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-review-${{ matrix.python }}
          path: '*-review-v3.json'
          if-no-files-found: warn
          retention-days: 7
      - name: Reproduce synthetic declaration report
        run: |
          python -m qualification --now-ms 1050 < qualification/rigs/synthetic-v1.json > first.json
          python -m qualification --now-ms 1050 < qualification/rigs/synthetic-v1.json > second.json
          cmp first.json second.json
          cmp first.json qualification/evidence/synthetic-report-v1.json
      - name: Preserve expired calibration failure
        run: |
          set +e
          python -m qualification --now-ms 1050 < qualification/rigs/expired-calibration-v1.json > expired.json
          qualification_status=$?
          set -e
          test "$qualification_status" -eq 1
          cmp expired.json qualification/evidence/expired-calibration-report-v1.json
      - name: Reproduce campaign coverage and rejected duplicate reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from qualification.campaign import evaluate
          root = Path("qualification")
          plan = (root / "plans/synthetic-campaign-v1.json").read_bytes()
          row = {"case_id": "blackout", "manifest": (root / "rigs/synthetic-v1.json").read_bytes(), "now_ms": 1050}
          for name, inputs in (("campaign-report-v1.json", [row]), ("campaign-reused-report-v1.json", [row, row])):
              first = evaluate(plan, inputs)
              assert first == evaluate(plan, inputs)
              raw = json.dumps(first, sort_keys=True, separators=(",", ":")) + "\n"
              assert raw == (root / "evidence" / name).read_text()
              assert first["physical_qualification_passed"] is False
          PY
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements-dev.txt ruff==0.16.10 bandit==1.9.4
      - run: ruff check qualification
      - run: ruff format --check qualification
      - run: bandit -r qualification -x qualification/tests
  ingress-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Acquire pinned audit-only parser
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-audit"
          curl --fail --location --proto '=https' --max-time 30 --max-filesize 1048576 \
            https://repo.maven.apache.org/maven2/com/fasterxml/jackson/core/jackson-core/2.21.5/jackson-core-2.21.5.jar \
            -o "$RUNNER_TEMP/qualification-audit/jackson-core.jar"
          printf '%s  %s\n' b64b5874162b503a0e58a8f7758266e8dd9f91bf49e3a59ae0b5f47589a231b7 \
            "$RUNNER_TEMP/qualification-audit/jackson-core.jar" | sha256sum --check
      - name: Compile bounded streaming probe
        run: |
          javac -J-XX:ActiveProcessorCount=1 -J-XX:+UseSerialGC -J-Xmx64m \
            -cp "$RUNNER_TEMP/qualification-audit/jackson-core.jar" \
            -d "$RUNNER_TEMP/qualification-audit" qualification/technology/IngressProbe.java
      - name: Compare ingress and semantic report preservation
        run: |
          python -m qualification.technology.compare_ingress --export > "$RUNNER_TEMP/qualification-audit/requests.hex"
          java -Xint -XX:ActiveProcessorCount=1 -XX:+UseSerialGC -Xmx64m \
            -cp "$RUNNER_TEMP/qualification-audit:$RUNNER_TEMP/qualification-audit/jackson-core.jar" \
            IngressProbe < "$RUNNER_TEMP/qualification-audit/requests.hex" > "$RUNNER_TEMP/qualification-audit/responses.jsonl"
          python -m qualification.technology.compare_ingress \
            --responses "$RUNNER_TEMP/qualification-audit/responses.jsonl" > "$RUNNER_TEMP/qualification-audit/comparison.json"
      - name: Reproduce byte ownership and hash primitive comparison
        run: |
          node --v8-pool-size=1 qualification/technology/hash-probe.mjs > "$RUNNER_TEMP/qualification-audit/hash-node.json"
          python -m qualification.technology.measure_binding > "$RUNNER_TEMP/qualification-audit/binding-python.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "qualification-audit"
          node = json.loads((root / "hash-node.json").read_text())
          python = json.loads((root / "binding-python.json").read_text())
          assert node["known_vectors"] == [
              "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855",
              "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad",
          ]
          assert node["four_mib_digests"] == python["four_mib_digests"]
          assert node["alias_changed"] and node["owned_preserved"]
          assert python["artifact_counts"]["matched"] == 4
          assert python["physical_qualification_passed"] is False
          PY
      - name: Compare campaign aggregation and duplicate mutation
        run: python -m qualification.technology.compare_campaign > "$RUNNER_TEMP/qualification-audit/campaign-comparison.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qualification-ingress-audit
          path: ${{ runner.temp }}/qualification-audit/*.json
          if-no-files-found: warn
          retention-days: 7
