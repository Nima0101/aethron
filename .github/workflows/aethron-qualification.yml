name: Qualification declaration contracts
on:
  pull_request:
    paths:
      - 'qualification/**'
      - 'aethron/_json_bounds.py'
      - 'requirements-dev.txt'
      - '.github/workflows/aethron-qualification.yml'
  push:
    branches: [main, 'parallel/p4-qualification-20261009']
    paths:
      - 'qualification/**'
      - 'aethron/_json_bounds.py'
      - 'requirements-dev.txt'
      - '.github/workflows/aethron-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s qualification/tests -v
      - name: Reproduce synthetic declaration report
        run: |
          python -m qualification --now-ms 1050 < qualification/rigs/synthetic-v1.json > first.json
          python -m qualification --now-ms 1050 < qualification/rigs/synthetic-v1.json > second.json
          cmp first.json second.json
          cmp first.json qualification/evidence/synthetic-report-v1.json
      - name: Preserve expired calibration failure
        run: |
          set +e
          python -m qualification --now-ms 1050 < qualification/rigs/expired-calibration-v1.json > expired.json
          qualification_status=$?
          set -e
          test "$qualification_status" -eq 1
          cmp expired.json qualification/evidence/expired-calibration-report-v1.json
      - name: Reproduce campaign coverage and rejected duplicate reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from qualification.campaign import evaluate
          root = Path("qualification")
          plan = (root / "plans/synthetic-campaign-v1.json").read_bytes()
          row = {"case_id": "blackout", "manifest": (root / "rigs/synthetic-v1.json").read_bytes(), "now_ms": 1050}
          for name, inputs in (("campaign-report-v1.json", [row]), ("campaign-reused-report-v1.json", [row, row])):
              first = evaluate(plan, inputs)
              assert first == evaluate(plan, inputs)
              raw = json.dumps(first, sort_keys=True, separators=(",", ":")) + "\n"
              assert raw == (root / "evidence" / name).read_text()
              assert first["physical_qualification_passed"] is False
          PY
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements-dev.txt ruff==0.16.10 bandit==1.9.4
      - run: ruff check qualification
      - run: ruff format --check qualification
      - run: bandit -r qualification -x qualification/tests
