name: Candidate artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r requirements-links.lock'
      - run: python scripts/verify.py
      - run: python scripts/fuzz.py
      - run: python scripts/temporal_fuzz.py
      - run: python scripts/reproduce.py
      - run: python scripts/release.py
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: local-scope-reference-candidate
          path: dist/
