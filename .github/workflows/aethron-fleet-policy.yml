name: AETHRON signed fleet policy
on:
  pull_request:
    paths:
      - 'integrations/edge/**'
      - 'tests/integration/test_fleet_policy.py'
      - 'tests/integration/test_fleet_floors.py'
      - 'tests/integration/test_fleet_admission.py'
      - 'tests/integration/test_fleet_rollout.py'
      - 'tests/integration/test_fleet_plan.py'
      - '.github/workflows/aethron-fleet-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  installed-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.13', '3.13.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install reviewed wheels
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          python -m pip install --require-hashes -r integrations/edge/requirements-server.lock
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir build/fleet-wheels . ./integrations/edge
          python -m pip install --no-index --no-deps --find-links build/fleet-wheels aethron==0.2.0 aethron-edge==0.1.0
      - name: Signed policy admission and substitution counterexamples
        run: |
          openssl version
          python -I -m unittest discover -s tests/integration -p test_fleet_policy.py -v
          python -I -m unittest discover -s tests/integration -p test_fleet_floors.py -v
          python -I -m unittest discover -s tests/integration -p test_fleet_admission.py -v
          python -I -m unittest discover -s tests/integration -p test_fleet_rollout.py -v
          python -I -m unittest discover -s tests/integration -p test_fleet_plan.py -v
