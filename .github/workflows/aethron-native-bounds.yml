name: AETHRON native protocol bounds
on:
  push:
    branches: [feat/aethron-code-checkpoint-20261009]
    paths: ['aethron/**', 'setup.py', 'pyproject.toml', 'MANIFEST.in', 'requirements-native.lock', 'tests/test_json_bounds.py', 'scripts/json_bounds_compare.py', '.github/workflows/aethron-native-bounds.yml']
  pull_request:
    paths: ['aethron/**', 'setup.py', 'pyproject.toml', 'MANIFEST.in', 'requirements-native.lock', 'tests/test_json_bounds.py', 'scripts/json_bounds_compare.py', '.github/workflows/aethron-native-bounds.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installed-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned build dependencies
        shell: bash
        run: |
          python -m pip install "setuptools==82.0.1; python_version < '3.10'" "setuptools==84.0.0; python_version >= '3.10'" wheel==0.48.0
          python -m pip install --no-deps --require-hashes -r requirements-native.lock
      - name: Build explicit native wheel
        env:
          AETHRON_BUILD_NATIVE_BOUNDS: '1'
        run: python -m pip wheel --no-deps --no-build-isolation -w build/native-bounds-wheels .
      - name: Offline installed core
        shell: bash
        run: python -m pip install --no-index --no-deps build/native-bounds-wheels/*.whl
      - name: Installed parser, safety and temporal parity
        env:
          AETHRON_EXPECT_NATIVE_BOUNDS: '1'
        run: |
          python -I -m unittest discover -s tests -p test_json_bounds.py -v
          python -I -m unittest discover -s tests -p test_core.py -v
          python -I -m unittest discover -s tests -p test_v2.py -v
          python -I -m unittest discover -s tests -p test_temporal.py -v
          python -I scripts/json_bounds_compare.py --require-native > build/native-bounds-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-bounds-${{ matrix.os }}-${{ matrix.python }}
          path: build/native-bounds-comparison.json
          retention-days: 7
          if-no-files-found: error
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Build instrumented wheel from a fresh checkout
        env:
          AETHRON_BUILD_NATIVE_BOUNDS: '1'
          CFLAGS: '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          LDFLAGS: '-fsanitize=address,undefined'
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          python -m pip install --no-deps --require-hashes -r requirements-native.lock
          python -m pip wheel --no-deps --no-build-isolation -w build/sanitized-wheels .
      - name: Offline install and instrumented malformed-input parity
        shell: bash
        env:
          AETHRON_EXPECT_NATIVE_BOUNDS: '1'
          ASAN_OPTIONS: 'detect_leaks=0:halt_on_error=1'
          UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'
        run: |
          python -m pip install --no-index --no-deps build/sanitized-wheels/*.whl
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" python -I -m unittest discover -s tests -p test_json_bounds.py -v
