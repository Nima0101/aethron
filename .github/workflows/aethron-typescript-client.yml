name: AETHRON TypeScript client

on:
  pull_request:
    paths:
      - 'examples/clients/typescript/**'
      - 'examples/operator/**'
      - 'contracts/**'
      - 'integrations/edge/**'
      - 'aethron/**'
      - 'examples/temporal-blackout.jsonl'
      - 'tests/integration/test_edge_http.py'
      - 'tests/integration/test_node_consumer_smoke.py'
      - 'scripts/edge_node_e2e.py'
      - '.github/workflows/aethron-typescript-client.yml'
  push:
    branches: [main]
    paths:
      - 'examples/clients/typescript/**'
      - 'examples/operator/**'
      - 'contracts/**'
      - 'integrations/edge/**'
      - 'aethron/**'
      - 'examples/temporal-blackout.jsonl'
      - 'tests/integration/test_edge_http.py'
      - 'tests/integration/test_node_consumer_smoke.py'
      - 'scripts/edge_node_e2e.py'
      - '.github/workflows/aethron-typescript-client.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  packed-client-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_THREADPOOL_SIZE: '1'
      NODE_OPTIONS: '--v8-pool-size=1 --max-old-space-size=192'
      NPM_CONFIG_CACHE: ${{ github.workspace }}/build/ecosystem-phase1/npm-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Initialize evidence directory
        run: |
          mkdir -p build/ecosystem-phase1/client-ci
          git rev-parse HEAD > build/ecosystem-phase1/client-ci/source-revision.txt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare locked service and client dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r integrations/edge/requirements-server.lock 2>&1 | tee build/ecosystem-phase1/client-ci/service-dependencies.log
          npm ci --prefix examples/clients/typescript --ignore-scripts 2>&1 | tee build/ecosystem-phase1/client-ci/client-dependencies.log
          npm ci --prefix examples/operator --ignore-scripts 2>&1 | tee build/ecosystem-phase1/client-ci/operator-dependencies.log
      - name: Client contracts and smoke rejection controls
        run: |
          npm test --prefix examples/clients/typescript 2>&1 | tee build/ecosystem-phase1/client-ci/client-tests.log
          npm test --prefix examples/operator 2>&1 | tee build/ecosystem-phase1/client-ci/operator-tests.log
          python -m unittest discover -s tests/integration -p test_node_consumer_smoke.py -v 2>&1 | tee build/ecosystem-phase1/client-ci/smoke-controls.log
      - name: Fresh packed client against the production service
        run: python scripts/edge_node_e2e.py 2>&1 | tee build/ecosystem-phase1/client-ci/packed-client.log
      - name: Retain success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typescript-client-${{ github.sha }}
          path: |
            build/ecosystem-phase1/client-ci/
            build/ecosystem-phase1/node-consumer.json
          if-no-files-found: error
          retention-days: 14
