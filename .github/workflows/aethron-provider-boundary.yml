name: AETHRON provider execution boundary
on:
  pull_request:
    paths:
      - 'aethron/vision/**'
      - 'tests/test_vision*.py'
      - 'requirements-coreml.txt'
      - 'requirements-vision.txt'
      - '.github/workflows/aethron-provider-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'aethron/vision/**'
      - 'tests/test_vision*.py'
      - 'requirements-coreml.txt'
      - 'requirements-vision.txt'
      - '.github/workflows/aethron-provider-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  provider-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install pinned binary provider packages
        run: |
          python -m pip install --only-binary=:all: -r requirements-coreml.txt
      - name: Real ORT wrapper with injected native execution faults
        run: |
          mkdir -p build/provider
          python -c "import cv2, numpy, onnxruntime; print(cv2.__version__, numpy.__version__, onnxruntime.__version__)" > build/provider/versions.txt
          python -m unittest discover -s tests -p 'test_vision*.py' -v > build/provider/tests.txt 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-boundary-linux
          path: build/provider/
          retention-days: 7
          if-no-files-found: error
