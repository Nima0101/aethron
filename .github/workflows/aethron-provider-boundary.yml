name: AETHRON provider execution boundary
on:
  pull_request:
    paths:
      - 'aethron/vision/**'
      - 'tests/test_vision*.py'
      - 'integrations/native-vision/**'
      - 'scripts/vision_admission_audit.py'
      - 'integrations/edge/aethron_edge/pipeline.py'
      - 'tests/integration/test_worker_cancellation.py'
      - 'requirements-coreml.txt'
      - 'requirements-vision.txt'
      - '.github/workflows/aethron-provider-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'aethron/vision/**'
      - 'tests/test_vision*.py'
      - 'integrations/native-vision/**'
      - 'scripts/vision_admission_audit.py'
      - 'integrations/edge/aethron_edge/pipeline.py'
      - 'tests/integration/test_worker_cancellation.py'
      - 'requirements-coreml.txt'
      - 'requirements-vision.txt'
      - '.github/workflows/aethron-provider-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  provider-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install pinned binary provider packages
        run: |
          python -m pip install --only-binary=:all: -r requirements-coreml.txt
          python -m pip install --only-binary=:all: --require-hashes -r integrations/edge/requirements-server.lock
      - name: Real ORT wrapper with injected native execution faults
        run: |
          mkdir -p build/provider
          python -c "import cv2, numpy, onnxruntime; print(cv2.__version__, numpy.__version__, onnxruntime.__version__)" > build/provider/versions.txt
          python -m unittest discover -s tests -p 'test_vision*.py' -v > build/provider/tests.txt 2>&1
      - name: Cooperative worker cancellation with the installed CPU binding
        env:
          PYTHONPATH: integrations/edge
        run: |
          python - <<'PY' > build/provider/worker-cancellation.txt 2>&1
          import unittest
          import onnxruntime as ort
          ort.disable_telemetry_events()
          suite = unittest.defaultTestLoader.discover('tests/integration', pattern='test_worker_cancellation.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != 8 or result.skipped or result.expectedFailures:
              raise SystemExit('worker cancellation coverage incomplete')
          PY
      - name: Build and install optional bounded CPU validator
        run: |
          python -m pip install --only-binary=:all: setuptools==84.0.0 wheel==0.48.0
          python -m pip wheel --no-deps --no-build-isolation integrations/native-vision --wheel-dir build/provider/wheels
          python -m pip install --no-deps --no-index build/provider/wheels/*.whl
      - name: Native buffer contracts and production dispatch parity
        run: |
          python -m unittest discover -s integrations/native-vision/tests -p test_bounds.py -v > build/provider/native-tests.txt 2>&1
          python -m unittest discover -s tests -p 'test_vision*.py' -v > build/provider/native-vision-tests.txt 2>&1
          python -m scripts.vision_admission_audit > build/provider/native-admission-profile.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-boundary-linux
          path: build/provider/
          retention-days: 7
          if-no-files-found: error
  native-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Build isolated native slice with undefined-behavior checks
        env:
          CFLAGS: '-fsanitize=undefined,bounds -fno-sanitize-recover=all'
          LDFLAGS: '-fsanitize=undefined,bounds'
        run: |
          mkdir -p build/native-sanitizer
          python -m pip install --only-binary=:all: setuptools==84.0.0 wheel==0.48.0 numpy==2.3.5
          python -m pip install --no-deps --no-build-isolation integrations/native-vision > build/native-sanitizer/build.txt 2>&1
      - name: Exercise exact buffer bounds and nonfinite values
        run: python -m unittest discover -s integrations/native-vision/tests -p test_bounds.py -v > build/native-sanitizer/tests.txt 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-admission-sanitizer
          path: build/native-sanitizer/
          retention-days: 7
          if-no-files-found: error
