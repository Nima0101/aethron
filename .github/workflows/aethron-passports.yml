name: Offline passport verification
on:
  pull_request:
    paths:
      - 'aethron/passport*.py'
      - 'aethron/interop_*.py'
      - 'tests/test_interop*.py'
      - 'examples/interop/**'
      - 'aethron/_json_bounds*'
      - 'tests/test_passport*.py'
      - 'examples/passports/**'
      - 'contracts/interop/**'
      - 'pyproject.toml'
      - 'requirements-passports.txt'
      - 'requirements-passport-conformance.txt'
      - '.github/workflows/aethron-passports.yml'
  push:
    branches: [main]
    paths:
      - 'aethron/passport*.py'
      - 'aethron/interop_*.py'
      - 'tests/test_interop*.py'
      - 'examples/interop/**'
      - 'aethron/_json_bounds*'
      - 'tests/test_passport*.py'
      - 'examples/passports/**'
      - 'contracts/interop/**'
      - 'pyproject.toml'
      - 'requirements-passports.txt'
      - 'requirements-passport-conformance.txt'
      - '.github/workflows/aethron-passports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-passport-conformance.txt
      - run: python -c "from jsonschema import Draft202012Validator"
      - run: python -m unittest discover -s tests -p test_passport_schemas.py -v
  passports:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c requirements-passports.txt '.[passports]'
      # The import assertion prevents optional-backend skips from masquerading as a pass.
      - run: python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey"
      - run: python -m unittest discover -s tests -p 'test_passport*.py' -v
      - run: python -m unittest discover -s tests -p 'test_interop*.py' -v
      - name: Verify installed package with source imports disabled
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "-I", "-c", '''
          import json
          from pathlib import Path
          from aethron.passports import verify
          from aethron.passport_evidence import verify_evidence
          from aethron.interop_tasks import validate_task
          from aethron.interop_bundles import verify_task_bundle
          from aethron.interop_federation import verify_federated_bundle
          vectors = json.loads(Path("examples/interop/federation-vectors-v1.json").read_bytes())
          for case in vectors["cases"]:
              result = verify_federated_bundle(
                  case["federation"].encode(), case["task"].encode(), case["envelope"].encode(),
                  case["policy"].encode(), tuple(bytes.fromhex(value) for value in case["evidence_hex"]),
                  **case["arguments"])
              assert (result.status, result.reason) == (case["status"], case["reason"]), case["name"]
              assert [item.outcome for item in result.evidence] == case["outcomes"]
              assert result.execution_authority is False and result.motion_authority is False
              assert result.evidence_verified is False
          vectors = json.loads(Path("examples/interop/bundle-vectors-v1.json").read_bytes())
          for case in vectors["cases"]:
              result = verify_task_bundle(
                  case["task"].encode(), case["envelope"].encode(), case["policy"].encode(),
                  tuple(bytes.fromhex(value) for value in case["evidence_hex"]), **case["arguments"])
              assert (result.status, result.reason) == (case["status"], case["reason"]), case["name"]
              assert [item.outcome for item in result.evidence] == case["outcomes"]
              assert result.execution_authority is False and result.motion_authority is False
          vectors = json.loads(Path("examples/interop/task-vectors-v1.json").read_bytes())
          for case in vectors["cases"]:
              result = validate_task(case["task"].encode(), **case["arguments"])
              assert (result.status, result.reason) == (case["status"], case["reason"]), case["name"]
              assert result.execution_authority is False and result.motion_authority is False
          vectors = json.loads(Path("examples/passports/vectors.json").read_bytes())
          for case in vectors["cases"]:
              result = verify(case["envelope"].encode(), case["policy"].encode(), **case["arguments"])
              assert (result.status, result.reason) == (case["status"], case["reason"]), case["name"]
              assert result.motion_authority is False and result.evidence_verified is False
          vectors = json.loads(Path("examples/passports/evidence-vectors.json").read_bytes())
          for case in vectors["cases"]:
              blobs = tuple(bytes.fromhex(blob) for blob in case["evidence_hex"])
              result = verify_evidence(case["envelope"].encode(), case["policy"].encode(), blobs, **case["arguments"])
              assert (result.status, result.reason) == (case["status"], case["reason"]), case["name"]
              assert [item.outcome for item in result.evidence] == case["outcomes"]
              assert result.motion_authority is False and result.evidence_verified is False
          '''.strip()], check=True)
