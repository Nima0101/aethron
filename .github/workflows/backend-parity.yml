name: Synthetic build backend parity
on:
  pull_request:
    paths:
      - '.github/workflows/backend-parity.yml'
      - 'requirements-backend-probe-linux.lock'
      - 'scripts/backend_parity_probe.py'
      - 'tests/test_backend_parity_probe.py'
      - 'LICENSE'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install isolated hash-pinned comparison backends
        run: >-
          python -m pip install --only-binary=:all: --require-hashes --no-deps
          --target "$RUNNER_TEMP/backend-tools" -r requirements-backend-probe-linux.lock
      - name: Test evidence rejection
        run: python -m unittest tests.test_backend_parity_probe -v
      - name: Compare synthetic wheels and installed console wrappers
        run: >-
          python scripts/backend_parity_probe.py
          --tools "$RUNNER_TEMP/backend-tools" --out "$RUNNER_TEMP/backend-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-backend-evidence-${{ github.sha }}
          retention-days: 5
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/backend-proof/results.json
            ${{ runner.temp }}/backend-proof/*-fixture/*.log
            ${{ runner.temp }}/backend-proof/*-fixture/pyproject.toml
            ${{ runner.temp }}/backend-proof/*-fixture/*/*.whl
