name: AETHRON installed ROS sensor candidate
on:
  pull_request:
    paths:
      - 'aethron/**'
      - 'pyproject.toml'
      - 'integrations/edge/**'
      - 'tests/ros2/**'
      - 'tests/integration/test_sensor*.py'
      - 'scripts/edge_ros2_check.py'
      - '.github/workflows/aethron-ros2-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-dds-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      SOURCE_DATE_EPOCH: '1767225600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Prepare pinned tools, wheels and ROS SDK image
        run: |
          python -m pip install build==1.6.1 setuptools==84.0.0 wheel==0.48.0
          python -m build --no-isolation --wheel --outdir build/ros/candidate .
          python -m build --no-isolation --wheel --outdir build/ros/candidate integrations/edge
          python -m pip download --require-hashes --only-binary=:all: --platform manylinux_2_17_aarch64 --python-version 312 --implementation cp --abi cp312 -r integrations/edge/ros2/requirements.lock -d build/ros/dependencies
          docker pull --platform linux/arm64 ros@sha256:8f687fdf084482819aa7dab48c3887331edd0d3687b219951fdb66c418316ab1
      - name: Real DDS from installed wheels with no external network
        run: python scripts/edge_ros2_check.py --wheels build/ros/candidate --dependencies build/ros/dependencies --out build/ros/check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ros-jazzy-arm64-software-evidence
          path: |
            build/ros/check/dds.log
            build/ros/check/result.json
            build/ros/check/bundle/wheels.json
          if-no-files-found: error
