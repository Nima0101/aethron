<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" role="img" aria-labelledby="t"><title id="t">Implemented RescueSense boundaries</title><rect width="1080" height="350" rx="14" fill="#10212b"/><g font-family="system-ui,sans-serif" fill="#eaf1eb"><text x="32" y="42" font-size="24">From bounded evidence to defensive recommendations</text><g stroke="#7595a0" fill="#203944"><rect x="30" y="88" width="165" height="124" rx="7"/><rect x="232" y="88" width="165" height="124" rx="7"/><rect x="434" y="88" width="165" height="124" rx="7"/><rect x="636" y="88" width="165" height="124" rx="7"/><rect x="838" y="88" width="210" height="124" rx="7"/></g><g font-size="15"><text x="44" y="118">Reference adapters</text><text x="44" y="146">thermal · depth</text><text x="44" y="172">minimized cues</text><text x="246" y="118">Validate</text><text x="246" y="146">time · calibration</text><text x="246" y="172">quality · privacy</text><text x="448" y="118">Extract rules</text><text x="448" y="146">finite work</text><text x="448" y="172">no raw export</text><text x="650" y="118">Fuse</text><text x="650" y="146">preserve support</text><text x="650" y="172">expose UNKNOWN</text><text x="852" y="118">Bounded output</text><text x="852" y="146">expiring envelopes</text><text x="852" y="172">WARN / STOP / HOVER</text><text x="852" y="194">LAND / RETREAT</text></g><g stroke="#ffb66e" stroke-width="3"><path d="M197 150h31m-8-7 8 7-8 7M399 150h31m-8-7 8 7-8 7M601 150h31m-8-7 8 7-8 7M803 150h31m-8-7 8 7-8 7"/></g><text x="32" y="264" font-size="16" fill="#9cdbc3">No identity · no person history · coarse through-obstruction only</text><text x="32" y="296" font-size="14" fill="#aac1c8">Hardware acquisition and independently validated safety controllers are external, unqualified boundaries.</text><text x="32" y="322" font-size="14" fill="#aac1c8">Synthetic fixtures exercise this complete software path. No direct actuation or learned human detector is bundled.</text></g></svg>
